name: Docker

# The images of Docker/Dockerfile (docs/building.md, "Docker"). Every push
# and pull request builds the check target: the loopback check under
# GNUstep, and an application built against the installed libraries with
# the make fragment and with pkg-config. A v* tag also publishes the sdk,
# runtime and ois-serve images to the GitHub Container Registry, for amd64
# and arm64, tagged with the version and latest.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  check:
    name: Images (check)
    runs-on: ubuntu-latest
    # The stack build is the long pole; the cache keeps it to the first run
    # after its pins change.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe, for the version the build files say

      - uses: docker/setup-buildx-action@v3

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build and check
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          target: check
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Images (publish)
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        target: [sdk, runtime, ois-serve]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names
        id: names
        run: |
          image=${{ matrix.target }}
          [ "$image" = ois-serve ] || image="odatakit-$image"
          version="${GITHUB_REF_NAME#v}"
          echo "tags=$REGISTRY/$image:$version,$REGISTRY/$image:latest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.names.outputs.version }}
          push: true
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
