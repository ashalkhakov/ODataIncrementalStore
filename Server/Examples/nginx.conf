# nginx in front of ois-serve: TLS, compression and limits here; the path is
# passed on unchanged (no URI after the upstream address), so /odata/...
# reaches the service under its own root.
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    gzip on;
    gzip_types application/json application/xml;

    location /odata/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ois-serve answers 413 above its own limit (64 MiB by default).
        client_max_body_size 64m;
        proxy_read_timeout 120s;
    }
}
